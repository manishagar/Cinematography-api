# Server networking, TLS termination, and embedded container configuration
server:
  port: 8082  # HTTPS listener port for the service

  ssl:
    enabled: true
    key-store: file:D:/dev/cinematography-config/cinematography-all.p12
    key-store-password: CineApis@2026
    key-store-type: pkcs12
    key-alias: cinematography-all
    key-password: CineApis@2026
    # TLS configuration for encrypted client communication

# Database connectivity and persistence configuration
spring:
  datasource:
    url: 'jdbc:sqlserver://localhost:1433;databaseName=CinematographyDB;encrypt=true;trustServerCertificate=true'
    username: cinematography_admin
    password: Manishag@2026
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    # Primary SQL Server datasource

    hikari:
      allow-pool-suspension: true
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      # Production-tuned connection pooling for reliability and fast failure

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    # ORM behavior with no schema mutation and no SQL logging

# Application-level security configuration
microservice:
  security:
    salt: wzebxmci9caz3lyy9sdllj9l5ipsxc

    jwt:
      secret-key: 
      expiration-time: 3600000
      # JWT signing secret (must be externalized in secure stores for production)

# Service discovery and registration configuration
eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 192.168.0.104
    securePortEnabled: true
    nonSecurePortEnabled: false
    # Instance identity and secure registration settings

  client:
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:8761/eureka/
      # Eureka server endpoint for service registration
